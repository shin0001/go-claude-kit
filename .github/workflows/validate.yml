name: validate-kit
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/validate-kit.sh
      - name: shellcheck
        run: |
          sudo apt-get install -y shellcheck >/dev/null
          shellcheck -S warning templates/hooks/*.sh scripts/*.sh
